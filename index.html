<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerardor de qrCode</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Gere e customize QR Codes <span>dinâmicos</span></h1>
  </header>

  <main class="qr-generator">
    <section class="qr-input">
      <label for="qr-link" class="qr-input__label">Digite seu link</label>
      <input id="qr-link" class="qr-input__field" type="text" placeholder="Seu link aqui">
      <div class="qr-preview">
        <!-- Compo de link + preview -->
         <h5 class="qr-preview__title">QR Code preview</h5>
        <img id="qr-preview" src="https://quickchart.io/qr?text=Here%27s%20my%20text&dark=f00&light=0ff&ecLevel=Q&format=svg" alt="" srcset="">
      </div>

    </section>

    <section class="qr-options">
      <!-- cores, logo, botão -->
      <div class="color-settings">
        <h2 class="color-settings__title">Cores</h2>
        <div class="color-settings__group">
          <label for="color-qr">Cor do qrcode</label>
          <input type="color" value="#f00000" id="color-qr" class="color-settings__input">
        </div>
        <div class="color-settings__group">
          <label for="color-background">Cor do fundo</label>
          <input type="color" value="#0fffff" id="color-background" class="color-settings__input">
        </div>
      </div>
      <a ></a>
      <a href="" target="_blank" id="btn-share" class="btn btn--primary">Compartilhar QR Code</a>
    </section>
  </main>

<footer></footer>

<script src="script.js"></script>
</body>
</html>
