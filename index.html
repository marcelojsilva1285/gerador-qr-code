<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerardor de qrCode</title>
</head>
<body>
  <header>
    <h1>Gere e customize QR Codes dinâmicos</h1>
  </header>

  <main class="qr-generator">
    <section class="qr-input">
      <label for="qr-link" class="qr-input__label">Digite seu link</label>
      <input id="qr-link" class="qr-input__field" type="text" placeholder="Seu link aqui">
      <div qr-preview></div>
      <!-- Compo de link + preview -->
    </section>

    <section class="qr-options">
      <!-- cores, logo, botão -->
      <div class="color-settings">
        <h2 class="color-settings__title">Cores</h2>
        <div class="color-settings__group">
          <label>Cor do qrcode</label>
          <input type="color" class="color-settings__input">
        </div>
        <div class="color-settings__group">
          <label>Cor do fundo</label>
          <input type="color" class="color-settings__input">
        </div>
      </div>

      <div class="log-settings">
        <h2 class="logo-settings__title">Logo</h2>
        <label>Insira seu Logo</label>
        <input type="file" class="logo-settings__upload">
        <label>Tamanho da logo</label>
        <select class="logo-settings__size">
          <option value="38px">38px x 38px</option>
        </select>
      </div>

      <button class="btn btn--primary">Baixar QR Code</button>
    </section>
  </main>

<footer></footer>
</body>
</html>
